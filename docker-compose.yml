services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media:/app/media
    ports:
      - "8000:8000"
    extra_hosts:
      # Lets a container reach PostgreSQL already running on the host.
      - "host.docker.internal:host-gateway"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  media:
